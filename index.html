<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marie Brethes Conseil</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --vert: #013927;
      --vert-mid: #2a5a45;
      --sauge: #6c8c7d;
      --sauge-pale: #b8ccc4;
      --fond: #edf3ec;
      --blanc: #ffffff;
      --corail: #f26b76;
      --text: #1a2e25;
      --text-light: #4a6358;
    }
    body {
      background: var(--vert);
      font-family: 'DM Sans', sans-serif;
      color: var(--fond);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .logo {
      width: clamp(200px, 48vw, 260px);
      height: auto;
      margin: 0 auto 26px;
      display: block;
    }
    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 19px;
      color: var(--sauge-pale);
      margin-bottom: 44px;
      line-height: 1.4;
    }
    .cta-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .cta {
      display: block;
      background: var(--fond);
      border: 1.5px solid transparent;
      border-radius: 14px;
      padding: 22px 48px 22px 24px;
      text-decoration: none;
      text-align: left;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
      position: relative;
    }
